name: SecurePipeline CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "02-securepipeline/**"
      - ".github/workflows/securepipeline-ci.yml"

  push:
    branches:
      - securepipeline-app
      - main
    paths:
      - "02-securepipeline/**"
      - ".github/workflows/securepipeline-ci.yml"

  workflow_dispatch:

concurrency:
  group: securepipeline-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: 02-securepipeline
  IMAGE_NAME: securepipeline

jobs:
  validate:
    name: Application & Container Validation
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Python syntax
        run: |
          python3 -m py_compile \
            02-securepipeline/app/app.py

      - name: Build Docker image
        run: |
          docker build \
            -t "${IMAGE_NAME}:${GITHUB_SHA}" \
            "${APP_DIR}"

      - name: Verify non-root runtime
        shell: bash
        run: |
          set -euo pipefail

          identity="$(
            docker run \
              --rm \
              --entrypoint id \
              "${IMAGE_NAME}:${GITHUB_SHA}"
          )"

          echo "${identity}"

          echo "${identity}" \
            | grep -q 'uid=10001(securepipeline)'

      - name: Start application
        run: |
          docker run \
            -d \
            --rm \
            --name securepipeline-ci \
            -p 18080:8080 \
            "${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Verify application health
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..20}; do
            if curl -fsS \
              http://127.0.0.1:18080/health \
              > /tmp/securepipeline-health.json; then
              break
            fi

            sleep 1
          done

          cat /tmp/securepipeline-health.json

          grep -q '"status":"healthy"' \
            /tmp/securepipeline-health.json

      - name: Show container logs
        if: always()
        run: |
          docker logs securepipeline-ci \
            --tail 50 || true

      - name: Stop application
        if: always()
        run: |
          docker stop securepipeline-ci || true
