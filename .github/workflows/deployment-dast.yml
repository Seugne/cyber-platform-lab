name: Deployment & DAST

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy CloudGuard production infrastructure"
        required: true
        default: false
        type: boolean

concurrency:
  group: cloudguard-production-deployment
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  AWS_REGION: eu-west-3
  AWS_DEFAULT_REGION: eu-west-3
  TF_DIR: 01-terraform-aws/terraform

jobs:
  production-deployment:
    name: Production deployment
    runs-on: ubuntu-latest

    environment:
      name: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Authenticate to AWS with deployment OIDC role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::982081065479:role/cloudguard-github-actions-deploy
          aws-region: eu-west-3
          role-session-name: CloudGuardProductionDeploy
          role-duration-seconds: 3600
          mask-aws-account-id: true

      - name: Verify AWS deployment identity
        shell: bash
        run: |
          set -euo pipefail

          aws sts get-caller-identity

          assumed_arn="$(
            aws sts get-caller-identity \
              --query Arn \
              --output text
          )"

          echo "Authenticated as: ${assumed_arn}"

          echo "${assumed_arn}" \
            | grep -q 'cloudguard-github-actions-deploy'

      - name: Terraform init
        run: |
          terraform -chdir="${TF_DIR}" init \
            -input=false

      - name: Terraform validate
        run: |
          terraform -chdir="${TF_DIR}" validate \
            -no-color

      - name: Terraform production plan
        shell: bash
        run: |
          set -euo pipefail

          terraform -chdir="${TF_DIR}" plan \
            -input=false \
            -lock-timeout=5m \
            -no-color \
            -var-file=environments/production.tfvars \
            -out=production.tfplan \
            | tee /tmp/cloudguard-production-deployment-plan.txt

      - name: Verify safe production plan
        shell: bash
        run: |
          set -euo pipefail

          if grep -Eq \
            'Plan: [0-9]+ to add, [1-9][0-9]* to change|Plan: [0-9]+ to add, [0-9]+ to change, [1-9][0-9]* to destroy' \
            /tmp/cloudguard-production-deployment-plan.txt; then
            echo "Unexpected change or destruction detected."
            exit 1
          fi

          grep -E '^Plan:' \
            /tmp/cloudguard-production-deployment-plan.txt

      - name: Terraform apply
        if: ${{ inputs.deploy == true }}
        shell: bash
        run: |
          set -euo pipefail

          terraform -chdir="${TF_DIR}" apply \
            -input=false \
            -auto-approve \
            production.tfplan

      - name: Wait for application target to become healthy
        if: ${{ inputs.deploy == true }}
        shell: bash
        run: |
          set -euo pipefail

          target_group_arn="$(
            terraform -chdir="${TF_DIR}" output \
              -raw application_target_group_arn
          )"

          echo "Target Group: ${target_group_arn}"

          aws elbv2 wait target-in-service \
            --target-group-arn "${target_group_arn}"

      - name: Verify CloudGuard HTTPS health
        if: ${{ inputs.deploy == true }}
        shell: bash
        run: |
          set -euo pipefail

          target_url="https://app.cloudguardlab.fr"

          for attempt in {1..30}; do
            echo "HTTPS health attempt ${attempt}/30"

            if curl -fsS \
              "${target_url}/health" \
              > /tmp/cloudguard-production-health.json; then
              break
            fi

            sleep 10
          done

          cat /tmp/cloudguard-production-health.json

          grep -Eq \
            '"status"[[:space:]]*:[[:space:]]*"healthy"' \
            /tmp/cloudguard-production-health.json

      - name: Prepare ZAP report directory
        if: ${{ inputs.deploy == true }}
        run: |
          mkdir -p zap-reports
          chmod 777 zap-reports

      - name: OWASP ZAP full DAST scan
        if: ${{ inputs.deploy == true }}
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            -v "${PWD}/zap-reports:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-full-scan.py \
              -t https://app.cloudguardlab.fr \
              -m 1 \
              -T 5 \
              -I \
              -r zap-report.html \
              -J zap-report.json \
              -w zap-report.md

      - name: Upload ZAP DAST reports
        if: ${{ inputs.deploy == true && always() }}
        uses: actions/upload-artifact@043fb4609c828e0cccf5b7a7411e8e94b370c057 # v7.0.1
        with:
          name: cloudguard-zap-dast-report
          path: zap-reports/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "## CloudGuard — Production Deployment"
            echo
            echo "| Control | Result |"
            echo "|---|---|"
            echo "| GitHub Environment | production |"
            echo "| Authentication | GitHub OIDC |"
            echo "| AWS role | cloudguard-github-actions-deploy |"
            echo "| Terraform backend | Remote S3 + KMS |"
            echo "| Deploy requested | ${{ inputs.deploy }} |"
            echo
            echo "### Terraform production plan"
            echo '```text'

            if [ -f /tmp/cloudguard-production-deployment-plan.txt ]; then
              grep -E '^Plan:|https_listener_enabled' \
                /tmp/cloudguard-production-deployment-plan.txt || true
            else
              echo "Production plan unavailable"
            fi

            echo '```'

            if [ "${{ inputs.deploy }}" = "true" ]; then
              echo
              echo "### Runtime validation"
              echo "| Control | Result |"
              echo "|---|---|"
              echo "| HTTPS endpoint | https://app.cloudguardlab.fr |"
              echo "| DAST | OWASP ZAP Full Scan |"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
